version: "3.8"

services:
  # Database Service (PostgreSQL)
  pgsql:
    image: postgres:15-alpine
    container_name: aidecms-pgsql
    restart: always
    environment:
      POSTGRES_USER: aidecms
      POSTGRES_PASSWORD: aidecms_secret
      POSTGRES_DB: aidecms
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - aidecms-network

  # Cache Service (Redis)
  redis:
    image: redis:7-alpine
    container_name: aidecms-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    networks:
      - aidecms-network

  # Analytic Database (ClickHouse)
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: aidecms-clickhouse
    restart: always
    volumes:
      - clickhousedata:/var/lib/clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - aidecms-network

  # Backend Service (Golang / Hertz)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aidecms-backend
    restart: always
    environment:
      - APP_ENV=production
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8888
      - DB_CONNECTION=postgres
      - DB_HOST=pgsql
      - DB_PORT=5432
      - DB_DATABASE=aidecms
      - DB_USERNAME=aidecms
      - DB_PASSWORD=aidecms_secret
      - REDIS_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CLICKHOUSE_ENABLED=true
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=9000
      - CLICKHOUSE_DATABASE=default
      - CLICKHOUSE_USERNAME=default
      - CLICKHOUSE_PASSWORD=
    volumes:
      - ./backend/storage:/app/storage
    ports:
      - "8888:8888"
    depends_on:
      - pgsql
      - redis
      - clickhouse
    networks:
      - aidecms-network

  # User Frontend (Web)
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: aidecms-web
    restart: always
    ports:
      - "8080:80"
    networks:
      - aidecms-network

  # Admin Frontend (Admin)
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: aidecms-admin
    restart: always
    ports:
      - "8081:80"
    networks:
      - aidecms-network

networks:
  aidecms-network:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  clickhousedata:
